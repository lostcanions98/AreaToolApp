name: iOS Build

on:
  push:
    branches: [main]

jobs:
  build-ios:
    runs-on: macos-latest

    steps:
      - name: Checkout repo
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Install dependencies
        run: npm install

      - name: Sync Capacitor
        run: npx cap sync ios

      - name: Install CocoaPods
        run: sudo gem install cocoapods

      - name: Install Pods
        working-directory: ios/App
        run: pod install

      - name: Build iOS (Xcode)
        working-directory: ios/App
        run: xcodebuild -workspace App.xcworkspace -scheme App -configuration Release -sdk iphoneos build
